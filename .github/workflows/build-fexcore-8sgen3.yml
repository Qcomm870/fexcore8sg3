name: Build FEXCore UnixLib (.wcp) for Snapdragon 8s Gen 3

# GitHub Actions workflow для сборки FEXCore (ARM64EC + WOW64 + UnixLib .so)
# в формате .wcp для Winlator-Ludashi / Winlator Bionic с реальными оптимизациями
# через FEXCore/Source/Interface/Config/Config.json.in и выбором сборки: с логом или без лога.

on:
  workflow_dispatch:
    inputs:
      fex_ref:
        description: 'Тег, ветка или коммит FEX-Emu (например FEX-2611.1 или main)'
        required: false
        default: 'FEX-2611.1'
      unixlib_libc:
        description: 'Тип libc для unixlib (.so): bionic для Winlator-Ludashi/Bionic, glibc для Linux Proton'
        type: choice
        options:
          - bionic
          - glibc
        default: 'bionic'
      perf_profile:
        description: 'Профиль оптимизаций: balanced (стабильнее, TSO on) или max_fps (TSO off, макс. FPS в CP2077)'
        type: choice
        options:
          - max_fps
          - balanced
        default: 'max_fps'
      enable_fex_logging:
        description: 'Сборка с логированием и телеметрией FEX (пишет в D:\\fexcore.log и D:\\fex_telemetry)'
        type: boolean
        default: false
      create_release:
        description: 'Опубликовать готовый .wcp в GitHub Releases (удобно скачивать с телефона)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-fexcore:
    name: Build FEXCore (${{ github.event.inputs.perf_profile || 'max_fps' }} / log=${{ github.event.inputs.enable_fex_logging || 'false' }})
    runs-on: ubuntu-24.04

    steps:
      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl wget git jq zip unzip tar xz-utils zstd file \
            build-essential cmake ninja-build python3 pkg-config \
            g++-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Setup llvm-mingw (ARM64EC + AArch64 PE toolchain)
        run: |
          set -euo pipefail
          LLVM_MINGW_TAG="20251104"
          TOOLCHAIN_DIR="/opt/llvm-mingw"
          wget -q "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_TAG}/llvm-mingw-${LLVM_MINGW_TAG}-ucrt-ubuntu-22.04-x86_64.tar.xz" -O llvm-mingw.tar.xz
          sudo rm -rf "$TOOLCHAIN_DIR"
          sudo mkdir -p "$TOOLCHAIN_DIR"
          sudo tar -C "$TOOLCHAIN_DIR" --strip-components=1 -xJf llvm-mingw.tar.xz
          rm -f llvm-mingw.tar.xz
          echo "$TOOLCHAIN_DIR/bin" >> "$GITHUB_PATH"

      - name: Clone FEX-Emu
        run: |
          set -euo pipefail
          REF="${{ github.event.inputs.fex_ref || 'FEX-2611.1' }}"
          git clone --depth 1 --branch "$REF" --recurse-submodules --shallow-submodules \
            https://github.com/FEX-Emu/FEX.git source || {
              git clone --recurse-submodules https://github.com/FEX-Emu/FEX.git source
              git -C source checkout "$REF"
              git -C source submodule update --init --recursive
            }

          COMMIT_FULL=$(git -C source rev-parse HEAD)
          COMMIT_SHORT=$(git -C source rev-parse --short HEAD)
          VER_CLEAN="${REF#FEX-}"
          LIBC="${{ github.event.inputs.unixlib_libc || 'bionic' }}"
          PROFILE="${{ github.event.inputs.perf_profile || 'max_fps' }}"
          LOG_ENABLED="${{ github.event.inputs.enable_fex_logging || 'false' }}"
          if [ "$LOG_ENABLED" = "true" ]; then
            LOG_TAG="log"
          else
            LOG_TAG="nolog"
          fi
          PKG_NAME="FEXCore-${VER_CLEAN}-8sGen3-${PROFILE}-${LOG_TAG}-unix-${LIBC}"

          {
            echo "FEX_REF=${REF}"
            echo "VER_CLEAN=${VER_CLEAN}"
            echo "COMMIT_FULL=${COMMIT_FULL}"
            echo "COMMIT_SHORT=${COMMIT_SHORT}"
            echo "PKG_NAME=${PKG_NAME}"
            echo "LIBC=${LIBC}"
            echo "PERF_PROFILE=${PROFILE}"
            echo "LOG_ENABLED=${LOG_ENABLED}"
          } >> "$GITHUB_ENV"

          if grep -q 'set(GIT_DESCRIBE_STRING "FEX-${OVERRIDE_VERSION}")' source/CMakeLists.txt; then
            echo "FEX_OVERRIDE=-DOVERRIDE_VERSION=${VER_CLEAN}" >> "$GITHUB_ENV"
          else
            echo "FEX_OVERRIDE=-DOVERRIDE_VERSION=FEX-${VER_CLEAN}" >> "$GITHUB_ENV"
          fi

      - name: Patch Config.json.in (8s Gen 3 optimizations + logging mode)
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import json, os, pathlib

          cfg_path = pathlib.Path("source/FEXCore/Source/Interface/Config/Config.json.in")
          if not cfg_path.exists():
              raise SystemExit(f"Config.json.in not found at {cfg_path}")

          data = json.loads(cfg_path.read_text(encoding="utf-8"))
          opts = data["Options"]

          profile = os.environ["PERF_PROFILE"]
          log_enabled = os.environ["LOG_ENABLED"] == "true"

          def set_default(section, key, value):
              if section in opts and key in opts[section]:
                  old = opts[section][key].get("Default")
                  opts[section][key]["Default"] = str(value)
                  print(f"[PATCH] {section}.{key}: {old} -> {value}")
              else:
                  print(f"[SKIP]  {section}.{key} not found in this FEX version")

          # --- 1. Ускорение JIT-кэша и снижение статтеров (главное для Cyberpunk 2077) ---
          # Включаем L2-кэш JIT (по умолчанию отключён ради экономии ОЗУ)
          set_default("Emulation", "DisableL2Cache", "false")
          # Отключаем динамическое сжатие L1-кэша JIT (убирает микрофризы при смене сцен)
          set_default("Emulation", "DynamicL1Cache", "false")
          # Включаем дисковый кэш скомпилированных JIT-блоков
          set_default("CPU", "DiskCache", "true")
          set_default("CPU", "DiskCacheFileMapping", "true")
          set_default("CPU", "Multiblock", "true")
          set_default("CPU", "MaxInst", "5000")
          set_default("CPU", "SmallTSCScale", "true")
          set_default("CPU", "HideHybrid", "true")

          # --- 2. Оптимизации TSO и x87 под Snapdragon 8s Gen 3 (без FEAT_LRCPC3) ---
          set_default("Hacks", "VectorTSOEnabled", "false")
          set_default("Hacks", "MemcpySetTSOEnabled", "false")
          set_default("Hacks", "HalfBarrierTSOEnabled", "true")
          set_default("Hacks", "VolatileMetadata", "true")
          set_default("Hacks", "KernelUnalignedAtomicBackpatching", "true")
          set_default("Hacks", "X87ReducedPrecision", "true")

          if profile == "max_fps":
              # Отключение полного TSO даёт самый сильный прирост CPU FPS на Snapdragon без LRCPC3
              set_default("Hacks", "TSOEnabled", "false")
          else:
              set_default("Hacks", "TSOEnabled", "true")

          # --- 3. Режим логирования / телеметрии vs чистая сборка без оверхеда ---
          if log_enabled:
              set_default("Logging", "SilentLog", "false")
              set_default("Logging", "OutputLog", "D:\\fexcore.log")
              set_default("Logging", "TelemetryDirectory", "D:\\fex_telemetry")
              set_default("Logging", "ProfileStats", "true")
              set_default("Debug", "DisableTelemetry", "false")
          else:
              set_default("Logging", "SilentLog", "true")
              set_default("Logging", "ProfileStats", "false")
              set_default("Debug", "DisableTelemetry", "true")

          cfg_path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          print("Config.json.in updated successfully.")
          PY

      - name: Build FEXCore PE DLLs (ARM64EC + WOW64)
        run: |
          set -euo pipefail
          cd source
          TOOLCHAIN="$PWD/Data/CMake/toolchain_mingw.cmake"
          [ -f "$TOOLCHAIN" ] || TOOLCHAIN="$PWD/toolchain_mingw.cmake"

          EXTRA_C_FLAGS="-O3 -DNDEBUG"
          if [ "$LOG_ENABLED" = "true" ]; then
            EXTRA_C_FLAGS="-O3 -DNDEBUG -g"
          fi

          build_dll() {
            local triple="$1"
            local stage="$2"
            local dir="build-${triple}"
            rm -rf "$dir" && mkdir -p "$dir"
            cmake -S . -B "$dir" -G Ninja -Wno-dev \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_FLAGS_RELEASE="$EXTRA_C_FLAGS" \
              -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG" \
              -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
              -DMINGW_TRIPLE="${triple}-w64-mingw32" \
              -DCMAKE_INSTALL_PREFIX=/usr \
              -DCMAKE_INSTALL_LIBDIR=/usr/lib/wine/aarch64-windows \
              -DTUNE_ARCH=generic \
              -DTUNE_CPU=none \
              -DENABLE_JEMALLOC_GLIBC_ALLOC=False \
              -DENABLE_LTO=False \
              -DENABLE_ASSERTIONS=False \
              -DBUILD_TESTING=False \
              -DBUILD_TESTS=False \
              ${FEX_OVERRIDE:+"$FEX_OVERRIDE"}
            ninja -C "$dir" -j "$(nproc)"
            DESTDIR="$stage" ninja -C "$dir" install
          }

          build_dll "arm64ec" "$GITHUB_WORKSPACE/stage-ec"
          build_dll "aarch64" "$GITHUB_WORKSPACE/stage-wow"

      - name: Build FEXCore UnixLib (.so)
        run: |
          set -euo pipefail
          UNIX_SRC="source/Source/Windows/UnixLib"
          if [ ! -f "$UNIX_SRC/FEXUnixLib.cpp" ]; then
            echo "::warning::Выбранная версия FEX (${FEX_REF}) не содержит UnixLib (добавлен в FEX-2607+)."
            echo "HAS_UNIXLIB=0" >> "$GITHUB_ENV"
            exit 0
          fi

          OPT_FLAGS="-O3 -march=armv8.2-a+fp16+dotprod+rcpc+lse+crypto -mtune=cortex-x4"

          if [ "$LIBC" = "bionic" ]; then
            NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
            if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
              echo "::error::Android NDK не найден на раннере"
              exit 1
            fi
            echo "Using Android NDK: $NDK"

            python3 - << 'PY'
          import pathlib, re

          cm = pathlib.Path("source/Source/Windows/UnixLib/CMakeLists.txt")
          if cm.exists():
              txt = cm.read_text(encoding="utf-8")
              txt = re.sub(r'\brt\b', '', txt)
              cm.write_text(txt, encoding="utf-8")

          cpp = pathlib.Path("source/Source/Windows/UnixLib/FEXUnixLib.cpp")
          src = cpp.read_text(encoding="utf-8")
          if ("shm_open" in src or "shm_unlink" in src) and "__ANDROID__" not in src:
              shim = """#if defined(__ANDROID__)
          #include <errno.h>
          #include <fcntl.h>
          #include <sys/stat.h>
          static inline int fex_bionic_shm_open(const char*, int, mode_t) { errno = ENOSYS; return -1; }
          static inline int fex_bionic_shm_unlink(const char*) { errno = ENOSYS; return -1; }
          #define shm_open fex_bionic_shm_open
          #define shm_unlink fex_bionic_shm_unlink
          #endif
          """
              cpp.write_text(shim + "\n" + src, encoding="utf-8")
              print("Injected Android Bionic shm_open/shm_unlink shim")
          PY

            NDK_CLANG="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang++"
            if ! "$NDK_CLANG" $OPT_FLAGS -x c++ -c /dev/null -o /dev/null 2>/dev/null; then
              OPT_FLAGS="-O3 -march=armv8.2-a+fp16+dotprod+rcpc+lse+crypto"
            fi
            echo "UnixLib (bionic) CXXFLAGS: $OPT_FLAGS"

            cmake -S "$UNIX_SRC" -B build-unix -G Ninja -Wno-dev \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=arm64-v8a \
              -DANDROID_PLATFORM=android-28 \
              -DCMAKE_CXX_FLAGS="$OPT_FLAGS" \
              -DCMAKE_INSTALL_PREFIX=/usr \
              -DCMAKE_INSTALL_LIBDIR=lib/wine/aarch64-unix
            ninja -C build-unix -j "$(nproc)"
            DESTDIR="$GITHUB_WORKSPACE/stage-unix" ninja -C build-unix install

            NDK_STRIP="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
            echo "UNIX_STRIP=$NDK_STRIP" >> "$GITHUB_ENV"
          else
            if ! aarch64-linux-gnu-g++ $OPT_FLAGS -x c++ -c /dev/null -o /dev/null 2>/dev/null; then
              OPT_FLAGS="-O3 -march=armv8.2-a+fp16+dotprod+rcpc+lse+crypto"
            fi
            echo "UnixLib (glibc) CXXFLAGS: $OPT_FLAGS"

            cmake -S "$UNIX_SRC" -B build-unix -G Ninja -Wno-dev \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_SYSTEM_NAME=Linux \
              -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
              -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
              -DCMAKE_CXX_FLAGS="$OPT_FLAGS" \
              -DCMAKE_INSTALL_PREFIX=/usr \
              -DCMAKE_INSTALL_LIBDIR=lib/wine/aarch64-unix
            ninja -C build-unix -j "$(nproc)"
            DESTDIR="$GITHUB_WORKSPACE/stage-unix" ninja -C build-unix install
            echo "UNIX_STRIP=aarch64-linux-gnu-strip" >> "$GITHUB_ENV"
          fi

          echo "HAS_UNIXLIB=1" >> "$GITHUB_ENV"

      - name: Package .wcp (Winlator-Ludashi / Bionic format)
        run: |
          set -euo pipefail
          PKG="$GITHUB_WORKSPACE/pkg"
          rm -rf "$PKG" out
          mkdir -p "$PKG/system32" out

          DLL_EC=$(find stage-ec -type f -name '*.dll' | head -n 1)
          DLL_WOW=$(find stage-wow -type f -name '*.dll' | head -n 1)
          cp "$DLL_EC" "$PKG/system32/libarm64ecfex.dll"
          cp "$DLL_WOW" "$PKG/system32/libwow64fex.dll"

          # В сборке без лога полностью вырезаем символы; в лог-сборке сохраняем C-отладку
          if [ "$LOG_ENABLED" != "true" ]; then
            /opt/llvm-mingw/bin/llvm-strip --strip-all "$PKG/system32"/*.dll
          fi

          if [ "$HAS_UNIXLIB" = "1" ]; then
            mkdir -p "$PKG/aarch64-unix"
            for name in libarm64ecfex libwow64fex; do
              SO_FILE=$(find stage-unix -type f -name "${name}.so" | head -n 1)
              cp "$SO_FILE" "$PKG/aarch64-unix/${name}.so"
            done
            "$UNIX_STRIP" --strip-unneeded "$PKG/aarch64-unix"/*.so
            chmod 0755 "$PKG/aarch64-unix"/*.so

            jq -n \
              --arg vn "${PKG_NAME}" \
              --argjson vc "${GITHUB_RUN_NUMBER}" \
              --arg desc "FEXCore ${VER_CLEAN} (${COMMIT_SHORT}) + unixlib (${LIBC}), 8s Gen 3 ${PERF_PROFILE}, log=${LOG_ENABLED}" \
              '{
                type: "FEXCore",
                versionName: $vn,
                versionCode: $vc,
                description: $desc,
                author: "FEX-Emu (Custom 8s Gen 3 Build)",
                files: [
                  { source: "system32/libarm64ecfex.dll", target: "${system32}/libarm64ecfex.dll" },
                  { source: "system32/libwow64fex.dll", target: "${system32}/libwow64fex.dll" },
                  { source: "aarch64-unix/libarm64ecfex.so", target: "${libdir}/wine/aarch64-unix/libarm64ecfex.so" },
                  { source: "aarch64-unix/libwow64fex.so", target: "${libdir}/wine/aarch64-unix/libwow64fex.so" }
                ]
              }' > "$PKG/profile.json"
          else
            jq -n \
              --arg vn "${PKG_NAME}" \
              --argjson vc "${GITHUB_RUN_NUMBER}" \
              --arg desc "FEXCore ${VER_CLEAN} (${COMMIT_SHORT}), 8s Gen 3 ${PERF_PROFILE}, log=${LOG_ENABLED} (DLL-only)" \
              '{
                type: "FEXCore",
                versionName: $vn,
                versionCode: $vc,
                description: $desc,
                author: "FEX-Emu (Custom 8s Gen 3 Build)",
                files: [
                  { source: "system32/libarm64ecfex.dll", target: "${system32}/libarm64ecfex.dll" },
                  { source: "system32/libwow64fex.dll", target: "${system32}/libwow64fex.dll" }
                ]
              }' > "$PKG/profile.json"
          fi

          jq empty "$PKG/profile.json"
          file "$PKG/system32/libwow64fex.dll" | grep -q 'PE32+ executable.*Aarch64'
          llvm-readobj --coff-load-config "$PKG/system32/libarm64ecfex.dll" | grep -q 'CHPEMetadata'

          if [ "$HAS_UNIXLIB" = "1" ]; then
            for f in "$PKG/aarch64-unix"/*.so; do
              file "$f" | grep -q 'ELF 64-bit LSB shared object, ARM aarch64'
              aarch64-linux-gnu-readelf --dyn-syms -W "$f" | grep -q '__wine_unix_call_funcs'
            done
          fi

          ( cd "$PKG" && tar --owner=0 --group=0 -cf - . | zstd -19 -q -o "$GITHUB_WORKSPACE/out/${PKG_NAME}.wcp" )
          ls -lh "$GITHUB_WORKSPACE/out/${PKG_NAME}.wcp"

      - name: Upload .wcp Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}
          path: out/*.wcp

      - name: Create GitHub Release (easy phone download)
        if: ${{ github.event.inputs.create_release != 'false' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ env.PKG_NAME }}-r${{ github.run_number }}"
          name: "${{ env.PKG_NAME }}"
          body: |
            ### FEXCore для Winlator-Ludashi (Snapdragon 8s Gen 3)
            - **Версия FEX**: `${{ env.FEX_REF }}` (`${{ env.COMMIT_SHORT }}`)
            - **Профиль**: `${{ env.PERF_PROFILE }}` (L1/L2 JIT-кэш + DiskCache + Fast x87)
            - **Логирование FEX**: `${{ env.LOG_ENABLED }}` (`D:\fexcore.log` и `D:\fex_telemetry` при включении)
            - **UnixLib**: `${{ env.LIBC }}` (`HAS_UNIXLIB=${{ env.HAS_UNIXLIB }}`)
            - **Установка**: Winlator → **Settings → Contents → Install Content** → выберите `${{ env.PKG_NAME }}.wcp`.
          files: out/*.wcp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
